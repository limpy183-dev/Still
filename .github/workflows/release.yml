name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check tag matches package.json
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match package.json version $version." }
      - run: npm ci
      - run: npm test
      - run: npm run dist
      - name: Verify relocated package and installer helpers
        run: |
          node tests/portability.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File tests/installer.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build Android preview APK
        working-directory: android
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          STILL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if (-not $env:ANDROID_KEYSTORE -or -not $env:STILL_KEYSTORE_PASSWORD) { throw "Add the ANDROID_KEYSTORE and ANDROID_KEYSTORE_PASSWORD repository secrets." }
          $env:STILL_KEYSTORE = "$env:RUNNER_TEMP\still-release.jks"
          [IO.File]::WriteAllBytes($env:STILL_KEYSTORE, [Convert]::FromBase64String($env:ANDROID_KEYSTORE))
          ./gradlew.bat testDebugUnitTest assembleRelease
          $code = $LASTEXITCODE
          Remove-Item $env:STILL_KEYSTORE
          if ($code -ne 0) { exit $code }
          Copy-Item build/outputs/apk/release/Still-release.apk "../release/Still-Android-preview-$($env:GITHUB_REF_NAME.TrimStart('v')).apk"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME "release/Still-Setup-$($env:GITHUB_REF_NAME.TrimStart('v')).exe" "release/Still-Android-preview-$($env:GITHUB_REF_NAME.TrimStart('v')).apk" --title "Still $env:GITHUB_REF_NAME" --notes-file .github/release-notes.md --generate-notes --latest
