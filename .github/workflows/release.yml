name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check tag matches Cargo.toml and package.json
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne $env:GITHUB_REF_NAME -or $cargo -ne $version) { throw "Tag $env:GITHUB_REF_NAME must match package.json ($version) and Cargo.toml ($cargo)." }
      - name: Check release notes cover only this version
        run: |
          $notes = Get-Content .github/release-notes.md -Raw
          $headings = @([regex]::Matches($notes, '(?m)^## What''s new in (v[^\r\n]+)\r?$'))
          if ($headings.Count -ne 1 -or $headings[0].Groups[1].Value -ne $env:GITHUB_REF_NAME) {
            throw "Release notes must have exactly one 'What's new in $env:GITHUB_REF_NAME' section."
          }
      - name: Update Rust
        run: rustup update stable --no-self-update; rustup default stable
      - name: Make sure the WebView2 runtime is installed
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          if (!(Get-ItemProperty $key -ErrorAction SilentlyContinue).pv) {
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile "$env:RUNNER_TEMP\webview2.exe"
            Start-Process "$env:RUNNER_TEMP\webview2.exe" -ArgumentList '/silent', '/install' -Wait
          }
      - run: npm ci
      - run: npm test
      - run: cargo test --workspace --release
      - run: npm run build
      - name: Verify relocated app and installer
        run: |
          node tests/portability.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/installer.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build Android preview APK
        working-directory: android
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          STILL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if (-not $env:ANDROID_KEYSTORE -or -not $env:STILL_KEYSTORE_PASSWORD) { throw "Add the ANDROID_KEYSTORE and ANDROID_KEYSTORE_PASSWORD repository secrets." }
          $env:STILL_KEYSTORE = "$env:RUNNER_TEMP\still-release.jks"
          [IO.File]::WriteAllBytes($env:STILL_KEYSTORE, [Convert]::FromBase64String($env:ANDROID_KEYSTORE))
          ./gradlew.bat testDebugUnitTest assembleRelease
          $code = $LASTEXITCODE
          Remove-Item $env:STILL_KEYSTORE
          if ($code -ne 0) { exit $code }
          Copy-Item build/outputs/apk/release/Still-release.apk "../dist/Still-Android-preview-$($env:GITHUB_REF_NAME.TrimStart('v')).apk"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME "dist/Still-Setup-$($env:GITHUB_REF_NAME.TrimStart('v')).exe" "dist/Still-Android-preview-$($env:GITHUB_REF_NAME.TrimStart('v')).apk" --title "Still $env:GITHUB_REF_NAME" --notes-file .github/release-notes.md --generate-notes --latest
